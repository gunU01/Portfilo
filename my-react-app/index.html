<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="프론트엔드 출신 PM의 포트폴리오. 문제 정의, 근거 기반 의사결정, 명세 작성 사례." />
    <meta name="theme-color" content="#ffffff" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f6bff'/%3E%3Cpath d='M9 22V10h6.2c2.6 0 4.2 1.4 4.2 3.6 0 1.5-.8 2.6-2.1 3.1L20 22h-3.2l-2.3-4.9H12V22z' fill='white'/%3E%3C/svg%3E"
    />
    <title>PM 포트폴리오</title>
    <script>
      // 첫 화면이 깜박이지 않도록, 저장된 화면 모드(없으면 기기 설정)를 렌더 전에 적용합니다.
      ;(function () {
        var theme = null
        try {
          theme = window.localStorage.getItem('portfolio-theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0c1424' : '#ffffff')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
